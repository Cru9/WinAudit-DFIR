<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;display=swap');
      .term-bg { fill: #0b0f19; rx: 12px; }
      .header-bg { fill: #131b2e; rx: 12px; }
      .btn-close { fill: #ef4444; }
      .btn-min { fill: #f59e0b; }
      .btn-max { fill: #10b981; }
      .title-text { fill: #94a3b8; font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 600; }
      .code-text { font-family: 'Fira Code', monospace; font-size: 13.5px; fill: #cbd5e1; }
      .cyan { fill: #38bdf8; font-weight: 700; }
      .green { fill: #4ade80; font-weight: 700; }
      .amber { fill: #fbbf24; font-weight: 700; }
      .red { fill: #f87171; font-weight: 700; }
      .purple { fill: #c084fc; font-weight: 700; }
      .dim { fill: #64748b; }
      .accent { fill: #00f2fe; }
      
      /* Terminal typing & pulse animations */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: blink 0.9s infinite; fill: #38bdf8; }

      @keyframes fadeInLine {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .line-1 { animation: fadeInLine 0.4s ease forwards 0.2s; opacity: 0; }
      .line-2 { animation: fadeInLine 0.4s ease forwards 0.7s; opacity: 0; }
      .line-3 { animation: fadeInLine 0.4s ease forwards 1.2s; opacity: 0; }
      .line-4 { animation: fadeInLine 0.4s ease forwards 1.7s; opacity: 0; }
      .line-5 { animation: fadeInLine 0.4s ease forwards 2.2s; opacity: 0; }
      .line-6 { animation: fadeInLine 0.4s ease forwards 2.7s; opacity: 0; }
      .line-7 { animation: fadeInLine 0.4s ease forwards 3.2s; opacity: 0; }
      .line-8 { animation: fadeInLine 0.4s ease forwards 3.7s; opacity: 0; }
      .line-9 { animation: fadeInLine 0.4s ease forwards 4.2s; opacity: 0; }
      .line-10 { animation: fadeInLine 0.4s ease forwards 4.7s; opacity: 0; }

      .box-glow {
        filter: drop-shadow(0 8px 30px rgba(0, 242, 254, 0.15));
      }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Window Container with Glow -->
  <g class="box-glow">
    <!-- Outer Border Glow -->
    <rect x="10" y="10" width="900" height="460" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />
    <!-- Terminal Background -->
    <rect x="12" y="12" width="896" height="456" class="term-bg" />
    <!-- Titlebar Background -->
    <rect x="12" y="12" width="896" height="42" fill="url(#headerGrad)" rx="12" />
    <rect x="12" y="44" width="896" height="10" fill="#0f172a" />
  </g>

  <!-- Window Controls -->
  <circle cx="36" cy="33" r="6.5" class="btn-close" />
  <circle cx="56" cy="33" r="6.5" class="btn-min" />
  <circle cx="76" cy="33" r="6.5" class="btn-max" />

  <!-- Window Title -->
  <text x="460" y="37" text-anchor="middle" class="title-text">Cru9 :: WinAudit-DFIR Suite v1.2 — [Live Incident Response Console]</text>

  <!-- Terminal Content Lines -->
  <g class="code-text" transform="translate(32, 85)">
    <!-- Line 1: Command prompt -->
    <g class="line-1">
      <text y="0"><tspan class="dim">PS C:\Incident-Response\WinAudit-DFIR&gt;</tspan> <tspan class="cyan">.\Suite-DFIR.bat</tspan></text>
    </g>

    <!-- Line 2: Master Banner -->
    <g class="line-2">
      <text y="28"><tspan class="cyan">========================================================================================</tspan></text>
      <text y="48"><tspan class="accent">  [+] WinAudit-DFIR Suite v1.2</tspan> <tspan class="dim">| Dual-Runtime Forensic Engine (Python 3 &amp; PowerShell)</tspan></text>
      <text y="68"><tspan class="cyan">========================================================================================</tspan></text>
    </g>

    <!-- Line 3: System Detection Info -->
    <g class="line-3">
      <text y="98"><tspan class="green">[✓] Runtime: Python 3.12 (Native Standard Library - 0 external pip requirements)</tspan></text>
      <text y="118"><tspan class="purple">[✓] Threat Intel Feeds: Abuse.ch Feodo Tracker (C2 Active) + LOLBAS Catalog (245+)</tspan></text>
    </g>

    <!-- Line 4: Sockets Inspection -->
    <g class="line-4">
      <text y="148"><tspan class="dim">[03:45:12]</tspan> <tspan class="cyan">[*] Escaneando sockets de red activos y resolviendo linaje WMI...</tspan></text>
      <text y="168"><tspan class="dim">            -> Mapeados 47 sockets TCP | 12 procesos evaluados contra base heuristica</tspan></text>
    </g>

    <!-- Line 5: Threat Alert Critical -->
    <g class="line-5">
      <text y="200"><tspan class="red">[!] CRITICAL ALERT [Score: 100/100] — Coincidencia C2 Feodo Tracker confirmada:</tspan></text>
      <text y="220"><tspan class="red">    PID: 4912 | Proceso: powershell.exe</tspan> <tspan class="dim">(LOLBin abused)</tspan> <tspan class="red">-> IP C2: 178.62.3.223:443</tspan></text>
      <text y="240"><tspan class="amber">    CommandLine: -w hidden -enc JABjAGwAaQBlAG4AdAAgAD0AIABOAGUAdwAtAE8AYgBqAGUAYwB0...</tspan></text>
    </g>

    <!-- Line 6: Wireless & Evil Twin Scan -->
    <g class="line-6">
      <text y="272"><tspan class="dim">[03:45:14]</tspan> <tspan class="cyan">[*] WiFiSentry: Barrido de radiofrecuencia 802.11 ax/ac y analisis espectral...</tspan></text>
      <text y="292"><tspan class="amber">[!] ADVERTENCIA RF: Rogue AP detectado en Canal 6 ("Oficina-Invitados" - BSSID Clonado)</tspan></text>
    </g>

    <!-- Line 7: Automated Forensics -->
    <g class="line-7">
      <text y="324"><tspan class="green">[✓] Accion Forense: MiniDump volcado a /Reportes/powershell_4912.dmp</tspan></text>
      <text y="344"><tspan class="green">[✓] Dashboard Generado: Reportes/SocketSentry_Dashboard_20261022.html</text>
    </g>

    <!-- Line 8: Interactive Cursor -->
    <g class="line-8">
      <text y="376"><tspan class="dim">PS C:\Incident-Response\WinAudit-DFIR&gt;</tspan> <tspan class="cyan">_</tspan><rect x="365" y="363" width="9" height="15" class="cursor" /></text>
    </g>
  </g>
</svg>
