name: "Sugerencia de Nueva Regla o Threat Intel"
description: "Proponer nuevos puertos C2, binarios de LOLBAS, patrones de CommandLine o fuentes de inteligencia."
title: "[Regla]: <Breve descripción de la propuesta>"
labels: ["mejora", "threat-intel"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por sugerir mejoras técnicas para expandir la detección de amenazas!
  - type: dropdown
    id: categoria
    attributes:
      label: Tipo de Detección Propuesta
      options:
        - "Nuevo Puerto C2 comúnmente usado por Malware"
        - "Nuevo Binario de LOLBAS (Abuso Living Off The Land)"
        - "Patrón sospechoso en CommandLine (Ofuscación, Base64, etc.)"
        - "Ruta de evasión en disco (Carpeta comúnmente usada por atacantes)"
        - "Nueva fuente de Threat Intelligence abierta"
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Detalle Técnico de la Regla
      description: Explica qué técnica de ataque detecta esta regla.
      placeholder: "Los frameworks modernos de C2 como Sliver suelen utilizar el puerto TCP..."
    validations:
      required: true
  - type: textarea
    id: referencias
    attributes:
      label: Referencias (MITRE ATT&CK, Artículos o Investigaciones)
      placeholder: "- MITRE ATT&CK T1059: Command and Scripting Interpreter\n- Enlace a reporte técnico..."
    validations:
      required: false
